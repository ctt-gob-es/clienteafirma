pdfpasswordprotected=PDFa pasahitzez babestuta dago. Sartu PDFko pasahitza.
pdfbadpassword=Sartutako pasahitza ez da zuzena. Sartu PDFko pasahitza.
xPathNotFound=Sinatu nahi duzun sinadurak ez du sinadura berririk onartzen. Sinadura berri bat gehitzeak aurreko sinadura baliogabetuko du. Jarraitu nahi duzu?