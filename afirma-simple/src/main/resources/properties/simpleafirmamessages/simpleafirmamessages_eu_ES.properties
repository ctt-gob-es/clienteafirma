SignPanel.40=<html><p>Pantaila honetan, zure disko gogorrean dauden fitxategiak elektronikoki sina ditzakezu.<br>Fitxategi bat elektronikoki sinatzen duzunean, datu pertsonal batzuk sar ditzakezu fitxategi horretan; besteak beste, zure NAN zenbakia, zure izen-abizenak edo zure lan-egoerari buruzko informazioa, ziurtagiri profesionala erabiltzen baduzu. Kontsultatu sinatutako fitxategien hartzaileen segurtasun- eta babes-politikak, bidali edo banatu aurretik.</p>Puntu horretatik aurrera, txartel adimendun bat edo USB gailu kriptografiko bat sartzen edo ateratzen baduzu, gako-biltegi egokia hautatu beharko duzu ziurtagiriak hautatzeko elkarrizketatik edo Eguneratu botoia sakatu, hautatutako biltegia kargatzeko.</html>
