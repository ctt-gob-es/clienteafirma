agePolicyIncompatibilitySign=Sortu nahi duzun sinadura ez da bateragarria AGEren sinadura-politikarekin, eta ez da baliozkotuko AGEren sinadura baliozkotzeko sistemen bidez.\nDeragiketa sinaduraren politika gehitu gabe osatzea nahi duzu?
agePolicyIncompatibilityCosign=Sinatu nahi duzun sinadura ez da bateragarria AGEren sinadura-politikarekin, eta ez dute baliozkotuko AGEren sinaduraren baliozkotze-sistemek.\nDeragiketa sinaduraren politika gehitu gabe osatzea nahi duzu?
agePolicyIncompatibilityCounterSign=Baieztatu nahi duzun sinadura ez da bateragarria AGEren sinadura-politikarekin, eta ez da baliozkotuko AGEren sinaduraren baliozkotze-sistemen bidez.\nDeragiketa sinaduraren politika gehitu gabe osatzea nahi duzu?
signingCertifiedPdf=Sinatu nahi duzun PDFa ziurtatuta dago eta ez du sinadura berririk onartzen. Sinadura berriak gehitzeak baliogabetu egingo du aurreko sinadura.\nDsegitu nahi duzu?
signingPdfWithUnregisteredSigns=Sinatu nahi duzun PDFak formatu zahar bateko aurretiko sinadurak ditu. Sinadura berriak gehitzeak lehendik daudenak baliogabetu ditzake.\nDsegitu nahi duzu?
signingModifiedPdfForm=PDF dokumentuak formulario bat du, eta formulario horren eremuak aldatu egin dira sinatu ondoren.\nDsegitu nahi duzu?
