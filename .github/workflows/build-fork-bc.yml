name: build-fork-bc

# CI dual (W2): build+F2 en ramas BouncyCastle sin sustituir build-baseline en master.
on:
  push:
    branches: ['crypto/**', 'Migracion_BouncyCastle']
  pull_request:
    branches: ['crypto/**', 'Migracion_BouncyCastle']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fork-bc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Full install (crypto + product JAR)
        run: |
          mvn -B clean install -Dmaven.test.skip=true
          mvn -B install -Dmaven.test.skip=true -Denv=install

      - name: Upload autofirma.jar (BC)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autofirma-jar-bc
          path: afirma-simple/target/autofirma.jar
          if-no-files-found: error

      - name: F2 regression (BC jar)
        env:
          AUTOFIRMA_JAR: ${{ github.workspace }}/afirma-simple/target/autofirma.jar
        run: bash scripts/f2-regression.sh
