name: OpenSSF Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@365df9f035d4b5177b9cd57330f8c3dfa6134420
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@4f900f43bc6bfc406aac5f37e402badfc55f9342
        with:
          sarif_file: results.sarif
